name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Format, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        id: install
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Build applications and generate frontend types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run build
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: bun run format:check
      - name: Lint changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        timeout-minutes: 5
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run lint:changed "$LINT_BASE_SHA"
      - name: Verify changed-file lint gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: node verification/lint-changed/run.mjs
      - name: Upload changed-file lint evidence
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-changed-evidence
          path: test-results/lint-changed/results.json
          if-no-files-found: error
      - name: Lint with type information
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run lint
      - name: Check workspace types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run check-types
      - name: Check design contracts and legacy import ratchet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:design "${DESIGN_BASE_SHA:-HEAD}"
      - name: React Doctor full-project error gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run check:react
      - name: Upload React Doctor diagnostics
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-evidence
          path: test-results/react-doctor/report.json
          if-no-files-found: error

  # The E2E suite is the only place the application is proven against a real
  # PostgreSQL: it applies every migration, provisions the restricted runtime
  # role, and asserts trigger, grant and exact-money behaviour. It needs the
  # server binaries because the harness runs initdb/pg_ctl itself.
  e2e:
    name: End-to-end (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        timeout-minutes: 5
        id: install
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL 17
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17

      - name: Verify PostgreSQL server binaries
        run: |
          set -euo pipefail
          bindir="${PG_BINDIR}"
          echo "PostgreSQL server binaries: ${bindir}"
          for binary in initdb pg_ctl postgres; do
            test -x "${bindir}/${binary}" || {
              echo "::error::${bindir}/${binary} is missing; the E2E harness cannot start a cluster"
              exit 1
            }
            "${bindir}/${binary}" --version
          done

      - name: Install and verify pinned offline Peppol validator
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv libxml2-utils
          node verification/peppol/setup.mjs
          .cache/peppol-validator/bin/python verification/peppol/check.e2e.py

      - name: Build applications
        timeout-minutes: 5
        run: bun run build

      - name: Install pinned Chromium for browser workflows
        timeout-minutes: 5
        run: bun run --cwd apps/api playwright install --with-deps chromium

      - name: Verify ownership declaration admission
        timeout-minutes: 2
        env:
          DOMAIN_OWNER_CHECK_ARTIFACTS: test-results/domain-owner-declarations
        run: node verification/domain-owners/check.e2e.mjs

      - name: Install Chromium for browser workflows
        timeout-minutes: 5
        run: bun run --cwd apps/api playwright install --with-deps chromium

      - name: Run domain owner public workflows
        timeout-minutes: 20
        env:
          OPENERP_E2E_ARTIFACTS: test-results/domain-owners
        run: bun run test:domain-owners

      - name: MCPJam real PostgreSQL workflows
        timeout-minutes: 10
        env:
          OPENERP_E2E_ARTIFACTS: test-results/mcpjam-protocol
        run: bun run test:mcp

      - name: MCPJam Luna behavior gate (enable after adding the key)
        if: ${{ vars.MCPJAM_MODEL_EVALS == 'enabled' }}
        timeout-minutes: 15
        env:
          MCPJAM_OPENAI_API_KEY: ${{ secrets.MCPJAM_OPENAI_API_KEY }}
        run: bun run test:mcp:eval --ci

      - name: Run checkpoint and restricted restore workflow
        timeout-minutes: 10
        env:
          OPENERP_REHEARSAL_ARTIFACTS: test-results/domain-rehearsal
        run: bun apps/api/scripts/operations/rehearsal-e2e.ts

      # The harness writes manifest.json (revision, worktree diff hash, lock hash,
      # per-migration SHA-256, postgres version) beside results.json and junit.xml.
      - name: Upload E2E evidence
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            test-results/peppol-validation/
            test-results/domain-owner-declarations/
            test-results/domain-owners/
            test-results/domain-rehearsal/
            test-results/mcpjam-protocol/
            test-results/mcpjam/
          if-no-files-found: warn
          retention-days: 14

  # Compares the real money owners (every rounding owner, VAT projection, FX
  # conversion and equal schedules) with the exact Bend model. The release lane
  # builds the model with the official Bend compiler from its pinned source,
  # checks it with the independent Lean safe kernel, runs the comparison against
  # the compiled artifact and exercises the real VAT host on PostgreSQL.
  bend:
    name: Exact money model (official Bend)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin
      BEND_SOURCE_ROOT: ${{ github.workspace }}/.cache/bend
      LEAN_BIN: ${{ github.workspace }}/.cache/lean-4.34.0-linux/bin/lean
      LEANC_BIN: ${{ github.workspace }}/.cache/lean-4.34.0-linux/bin/leanc
      OPENERP_REPO: ${{ github.workspace }}
      OPENERP_OWNER_ADAPTER: ${{ github.workspace }}/verification/bend/current-owner-authority.mjs

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        id: install
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Install PostgreSQL 17
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common zstd
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
      # The checksum pins the official v4.34.0 release asset as first downloaded.
      - name: Install pinned Lean 4.34.0
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl -sSLf -o .cache/lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst
          echo "caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  .cache/lean.tar.zst" | sha256sum -c -
          zstd -dc .cache/lean.tar.zst | tar -xf - -C .cache
          rm .cache/lean.tar.zst
      - name: Fetch and verify pinned Bend source
        timeout-minutes: 5
        run: node --experimental-strip-types verification/bend/scripts/bootstrap-upstream.mjs "$BEND_SOURCE_ROOT"
      - name: Official release lane
        timeout-minutes: 25
        run: npm --prefix verification/bend run verify:release
      - name: Upload model evidence
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: bend-evidence
          path: verification/bend/evidence/current/
          if-no-files-found: error
          retention-days: 14
