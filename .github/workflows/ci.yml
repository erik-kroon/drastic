name: OpenERP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        id: install
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Build applications and generate frontend types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run build
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: bun run format:check
      - name: Lint with type information
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run lint
      - name: Check workspace types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bun run check-types
      - name: Check domain leaf integration declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: bun run check:integration

  # The E2E suite is the only place the application is proven against a real
  # PostgreSQL: it applies every migration, provisions the restricted runtime
  # role, and asserts trigger, grant and exact-money behaviour. It needs the
  # server binaries because the harness runs initdb/pg_ctl itself.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL 17
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17

      - name: Verify PostgreSQL server binaries
        run: |
          set -euo pipefail
          bindir="${PG_BINDIR}"
          echo "PostgreSQL server binaries: ${bindir}"
          for binary in initdb pg_ctl postgres; do
            test -x "${bindir}/${binary}" || {
              echo "::error::${bindir}/${binary} is missing; the E2E harness cannot start a cluster"
              exit 1
            }
            "${bindir}/${binary}" --version
          done

      - name: Build applications for self-host proof
        timeout-minutes: 5
        run: bun run build

      - name: Install pinned Chromium for browser proof
        timeout-minutes: 5
        run: bun run --cwd apps/api playwright install --with-deps chromium

      - name: Run scoped excellence qualification
        id: e2e
        timeout-minutes: 50
        run: |
          set -o pipefail
          mkdir -p test-results/ci
          node verification/assurance/excellence/scripts/run.mjs core 2>&1 | tee test-results/ci/e2e.log

      # The harness writes manifest.json (revision, worktree diff hash, lock hash,
      # per-migration SHA-256, postgres version) beside results.json and junit.xml.
      - name: Upload E2E evidence
        if: ${{ always() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure' || steps.e2e.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            test-results/e2e/
            test-results/excellence/
            test-results/excellence-native/
            test-results/assurance/
            test-results/excellence-child-links/
            test-results/ci/e2e.log
          if-no-files-found: error
          retention-days: 14
